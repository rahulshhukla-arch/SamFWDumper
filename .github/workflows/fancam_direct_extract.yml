name: S24 FanCam libraries - direct extraction

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Full direct firmware ZIP URL (sf06.click link)'
        required: true
        type: string

jobs:
  extract-fancam:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout existing SamFWDumper tools
        uses: actions/checkout@v4

      - name: Install extraction requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq xz-utils lz4 unzip curl wget e2fsprogs android-sdk-libsparse-utils
          chmod +x bin/lp/* bin/ext4/* bin/erofs-utils/* bin/py_scripts/* scripts/system_files.sh || true

      - name: Extract S24 system lib64 from firmware
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          set -euo pipefail
          bash scripts/system_files.sh "$FIRMWARE_URL" 0 \
            false false false false false true false false false false false true false false false
          test -s output/lib64.tar

      - name: Select only FanCam libraries and build info
        run: |
          set -euo pipefail
          mkdir -p fancam_output
          cp output/build.prop fancam_output/build.prop
          tar -tf output/lib64.tar | grep -E '(^|/)(libveframework\.videoeditor\.samsung\.so|libveengine\.arcsoft\.so)$' > /tmp/fancam_paths.txt || true
          echo 'Matching files:'
          cat /tmp/fancam_paths.txt
          test -s /tmp/fancam_paths.txt
          tar -xf output/lib64.tar -C fancam_output -T /tmp/fancam_paths.txt
          find fancam_output -type f -printf '%P: %s bytes\n'

      - name: Publish small GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: S24-FanCam-Native-Libraries
          path: fancam_output/
          if-no-files-found: error
          retention-days: 7
